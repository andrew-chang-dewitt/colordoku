[package]
name = "colordoku-generator"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-bindgen is only needed for the browser build, so `cargo test` on the host
# never compiles it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.127"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
