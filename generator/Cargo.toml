[package]
name = "colordoku-generator"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

# No dependencies. The wasm boundary is a hand-written C ABI (src/abi.rs) rather
# than wasm-bindgen, so building needs only cargo and the wasm32 target — no
# wasm-pack, and no version-matched code generator to install.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
